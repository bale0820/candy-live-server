name: candy-live Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
              cd /home/ubuntu/candy/express/candy-live-server
              ./deploy-live.sh
              # git fetch origin

              # git reset --hard origin/main

              # npm ci

              # npm run build

              # pm2 reload candy-live || pm2 start dist/app.js --name candy-live

              # pm2 save
